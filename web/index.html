<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>hermes-beaver</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* The kiosk's colours (ui/theme.slint), sized for a desk instead of a wall. */
:root {
  --bg: #0e1014; --panel: #161920; --border: #252a35; --track: #232733;
  --text: #e8eaf0; --dim: #8b92a5; --accent: #e8a052;
  --ok: #4cc38a; --warn: #e5b84a; --danger: #e5534b;
  --gh: #8957e5; --tg: #1f8fd1; --cli: #4b5263;
  --mono: "DejaVu Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
}
a { color: inherit; text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; text-decoration-color: var(--accent); }
.dim { color: var(--dim); }
.small { font-size: 13px; }
/* Tones, as on the kiosk: 1 working, 2 attention, 3 danger, 4 ok, 5 dim. */
.t1 { color: var(--accent); } .t2 { color: var(--warn); } .t3 { color: var(--danger); }
.t4 { color: var(--ok); } .t5 { color: var(--dim); }

header { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin: 0 4px 16px; }
#host { color: var(--accent); font-size: 20px; font-weight: 800; }
#banner {
  flex: 1 1 0; min-width: 0; padding: 6px 14px; border-radius: 8px;
  background: var(--danger); color: #fff; font-weight: 700; text-align: center;
}
.when { margin-left: auto; text-align: right; }
.clock { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
#status { font-size: 13px; color: var(--dim); }
#updated.late { color: var(--warn); }
#updated.lost { color: var(--danger); font-weight: 700; }

/* One column, what needs you first; from 1200 px the kiosk's grid, left column 60%. */
.grid {
  display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "needs" "tasks" "done" "mascot" "load";
}
.grid.stale { opacity: .55; }
#p-tasks { grid-area: tasks; } #p-needs { grid-area: needs; } #p-done { grid-area: done; }
#p-load { grid-area: load; } #p-mascot { grid-area: mascot; }

.panel { min-width: 0; padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
.panel h2 { margin: 0 0 12px; color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: .2em; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.hint { color: var(--dim); font-size: 13px; font-style: italic; }

.row { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.main { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.badge {
  flex: none; width: 40px; margin-top: 1px; padding: 3px 0; border-radius: 5px;
  background: var(--cli); color: #fff; font-size: 11px; font-weight: 800; text-align: center;
}
.badge.GH { background: var(--gh); } .badge.TG { background: var(--tg); }
.status, .outcome, .age { flex: none; padding-top: 2px; font-size: 13px; text-align: right; white-space: nowrap; }
.status, .outcome { font-weight: 700; }
.stripe { flex: none; align-self: stretch; width: 5px; border-radius: 3px; background: currentColor; }
.label { margin-right: 8px; font-size: 12px; font-weight: 800; letter-spacing: .04em; }
.done .main { padding-top: 1px; font-size: 14px; }

/* One grid for all gauges, so their bars and sparklines line up. */
#metrics { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; }
.metric { display: contents; }
.metric + .metric > :nth-child(-n+3) { margin-top: 14px; }
.mlabel { font-weight: 700; }
.bar { height: 10px; overflow: hidden; border-radius: 5px; background: var(--track); }
.fill { height: 100%; border-radius: 5px; background: var(--accent); }
.fill.warn { background: var(--warn); } .fill.danger { background: var(--danger); }
.mval { min-width: 44px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.spark { display: block; width: 100%; height: 28px; }
.spark path { fill: none; stroke: var(--accent); stroke-opacity: .65; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.mdetail { text-align: right; white-space: nowrap; }

.mascot { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; }
#art {
  --art-px: 16; --cols: 40; --avail: calc(100vw - 72px);
  margin: 0; font-family: var(--mono); line-height: 1.164; white-space: pre;
  font-size: min(calc(var(--art-px) * 1px), calc(var(--avail) / (var(--cols) * 0.61)));
}
.side { flex: 1 1 180px; min-width: 0; }
#caption { font-size: 16px; font-weight: 700; }
.counter { margin-top: 14px; font-size: 52px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }

@media (min-width: 1200px) {
  .grid {
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    grid-template-areas: "tasks load" "needs mascot" "done mascot";
  }
  #art { --avail: calc((100vw - 48px) * .4 - 44px); }
}
@media (max-width: 700px) {
  #banner { order: 3; flex-basis: 100%; }
}
/* Phones: a row's status goes under its title, which keeps the full width. */
@media (max-width: 520px) {
  .task, .done { flex-wrap: wrap; row-gap: 2px; }
  .task .main, .done .main { flex-basis: calc(100% - 52px); }
  .task .status, .done .outcome { margin-left: 52px; padding-top: 0; text-align: left; }
  .done .age { padding-top: 0; }
}
</style>
</head>
<body>
<header>
  <div id="host"></div>
  <div id="banner" role="alert" hidden></div>
  <div class="when">
    <div class="clock"><span id="clock">--:--</span><span id="seconds" class="dim"></span></div>
    <div id="status"><span id="screen"></span><span id="sep" hidden> · </span><span id="updated">connecting…</span></div>
  </div>
</header>
<main class="grid" id="grid">
  <section class="panel" id="p-needs"><h2>NEEDS YOU</h2><div class="rows" id="needs"></div></section>
  <section class="panel" id="p-tasks"><h2>TASKS &amp; QUEUE</h2><div class="rows" id="tasks"></div></section>
  <section class="panel" id="p-done"><h2>RECENTLY FINISHED</h2><div class="rows" id="done"></div></section>
  <section class="panel" id="p-mascot">
    <h2 id="mascot-title"></h2>
    <div class="mascot">
      <pre id="art"></pre>
      <div class="side">
        <div id="caption"></div>
        <div class="counter" id="counter"></div>
        <div class="dim small" id="counter-label"></div>
      </div>
    </div>
  </section>
  <section class="panel" id="p-load"><h2>SYSTEM LOAD</h2><div id="metrics"></div></section>
</main>
<script>
"use strict";
// Replaced by the server; /state.json carries the same, and a change means a deploy.
const BUILD = "__BUILD__";
const POLL_MS = 5000, LATE_S = 30, LOST_S = 120;
const SVG = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);

const started = performance.now();
let base = null;    // the server's clock: {ms, at (performance.now()), offset (s)}
let lastOk = null;  // performance.now() of the last good poll
let latest = null;  // the last state drawn
const drawn = {};   // section -> the JSON it was last drawn from

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// The server only sends https://github.com/ links.
function linked(text, href) {
  if (!href) return document.createTextNode(text);
  const a = el("a", null, text);
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

const tone = (t) => "t" + (t | 0);

// Redraws a section only when its data changed, so a selection survives polls.
function draw(key, data, fn) {
  const json = JSON.stringify(data);
  if (drawn[key] === json) return;
  drawn[key] = json;
  fn();
}

function list(id, rows, hint, row) {
  const box = $(id);
  box.replaceChildren(...rows.map(row));
  if (hint) box.append(el("div", "hint", hint));
}

function taskRow(t) {
  const r = el("div", "row task");
  const main = el("div", "main");
  const title = el("div", t.tone === 5 ? "dim" : null);
  title.append(linked(t.title, t.link));
  main.append(title);
  if (t.meta) main.append(el("div", "dim small", t.meta));
  r.append(el("span", "badge " + t.badge, t.badge), main, el("div", "status " + tone(t.tone), t.status));
  return r;
}

function needRow(n) {
  const r = el("div", "row need");
  const main = el("div", "main");
  const line = el("div");
  line.append(el("span", "label " + tone(n.tone), n.label), linked(n.title, n.link));
  main.append(line);
  if (n.detail) main.append(el("div", "dim small", n.detail));
  r.append(el("span", "stripe " + tone(n.tone)), main, el("div", "age dim", n.age));
  return r;
}

function doneRow(d) {
  const r = el("div", "row done");
  const main = el("div", "main");
  main.append(linked(d.title, d.link));
  r.append(el("span", "badge " + d.badge, d.badge), main,
    el("div", "outcome " + tone(d.tone), d.outcome), el("div", "age dim", d.age));
  return r;
}

function metricRow(m) {
  const r = el("div", "metric");
  const v = Math.max(0, Math.min(1, m.value));
  const bar = el("div", "bar");
  const fill = el("div", "fill" + (v > 0.9 ? " danger" : v > 0.75 ? " warn" : ""));
  fill.style.width = (v * 100).toFixed(1) + "%";
  bar.append(fill);
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "spark");
  svg.setAttribute("viewBox", "0 0 1000 100");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(SVG, "path");
  path.setAttribute("d", m.spark || "M 0 100 L 1000 100");
  svg.append(path);
  r.append(el("span", "mlabel", m.label), bar, el("span", "mval", m.text),
    el("span"), svg, el("span", "mdetail dim small", m.detail));
  return r;
}

function render(s) {
  latest = s;
  $("host").textContent = s.hostname;
  const banner = $("banner");
  banner.textContent = s.banner;
  banner.hidden = !s.banner;
  $("screen").textContent = s.screen;
  $("sep").hidden = !s.screen;
  draw("needs", [s.needs, s.needs_hint], () => list("needs", s.needs, s.needs_hint, needRow));
  draw("tasks", [s.tasks, s.tasks_hint], () => list("tasks", s.tasks, s.tasks_hint, taskRow));
  draw("done", [s.done, s.done_hint], () => list("done", s.done, s.done_hint, doneRow));
  draw("metrics", s.metrics, () => list("metrics", s.metrics.filter((m) => m.shown), "", metricRow));
  const mascot = [s.mascot_title, s.mascot_art, s.mascot_caption, s.mascot_tone,
    s.mascot_font_px, s.counter, s.counter_label];
  draw("mascot", mascot, () => {
    $("mascot-title").textContent = s.mascot_title;
    const art = $("art");
    art.textContent = s.mascot_art;
    art.className = tone(s.mascot_tone);
    const cols = Math.max(1, ...s.mascot_art.split("\n").map((l) => l.length));
    art.style.setProperty("--art-px", String(s.mascot_font_px * 0.75));
    art.style.setProperty("--cols", String(cols));
    const caption = $("caption");
    caption.textContent = s.mascot_caption;
    caption.className = tone(s.mascot_tone);
    $("counter").textContent = s.counter;
    $("counter-label").textContent = s.counter_label;
  });
}

// A new build reloads the page once; if the reload still serves another build
// (a cache in between, say), carry on rather than reload forever.
function reloadFor(build) {
  let tried = null;
  try { tried = sessionStorage.getItem("hb-reloaded-for"); } catch (e) {}
  if (tried === build) return false;
  try { sessionStorage.setItem("hb-reloaded-for", build); } catch (e) {}
  location.reload();
  return true;
}

let pollTimer = null;
async function poll() {
  clearTimeout(pollTimer);
  const ctl = new AbortController();
  const timeout = setTimeout(() => ctl.abort(), 4000);
  try {
    const r = await fetch("state.json", { cache: "no-store", signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    if (s.build !== BUILD && reloadFor(s.build)) return;
    const now = performance.now();
    base = { ms: s.now_ms, at: now, offset: s.utc_offset_secs };
    lastOk = now;
    render(s);
    tick();
  } catch (e) {
    // The header shows how old the data is.
  } finally {
    clearTimeout(timeout);
  }
  // Whichever poll ends last owns the one timer.
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, POLL_MS);
}

const pad = (n) => String(n).padStart(2, "0");

function title(lost) {
  if (!latest) return document.title;
  let t = latest.name + " · " + latest.hostname;
  if (latest.needs_you > 0) t = "(" + latest.needs_you + ") " + t;
  if (latest.banner || lost) t = "⚠ " + t;
  return t;
}

// The host's clock, ticking here between polls, and how old the data is.
let tickTimer = null;
function tick() {
  clearTimeout(tickTimer);
  const now = performance.now();
  let wait = 1000;
  if (base) {
    const ms = base.ms + (now - base.at);
    const d = new Date(ms + base.offset * 1000);
    $("clock").textContent = pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
    $("seconds").textContent = ":" + pad(d.getUTCSeconds());
    wait = 1000 - (((ms % 1000) + 1000) % 1000) + 20;
  }
  const age = (now - (lastOk ?? started)) / 1000;
  const updated = $("updated");
  let state = "";
  if (age >= LOST_S) {
    updated.textContent = (latest ? latest.name : "The dashboard") + " not responding";
    state = "lost";
  } else if (lastOk === null) {
    updated.textContent = "connecting…";
  } else {
    updated.textContent = "updated " + Math.floor(age) + " s ago";
    if (age >= LATE_S) state = "late";
  }
  updated.className = state;
  $("grid").classList.toggle("stale", state === "lost");
  document.title = title(state === "lost");
  tickTimer = setTimeout(tick, wait);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) poll();
});
poll();
tick();
</script>
</body>
</html>
