[package]
name = "hermes-beaver"
version = "0.1.0"
edition = "2024"
description = "Lightweight full-screen dashboard for Hermes Agent"
repository = "https://github.com/ideaconnect/hermes-beaver"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
# X11 only, both renderers (OpenGL default, software fallback), no accessibility/tray.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
] }
toml = "1.1.8"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
