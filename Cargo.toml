[package]
name = "hermes-beaver"
version = "0.1.0"
edition = "2024"
description = "Lightweight full-screen dashboard for Hermes Agent"
repository = "https://github.com/ideaconnect/hermes-beaver"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
# Wayland only (winit is built without X11), both renderers (software default, OpenGL),
# no accessibility/tray.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-wayland",
    "renderer-femtovg",
    "renderer-software",
] }
toml = "1.1.8"
# Input activity from the compositor (ext-idle-notify-v1) for waking the monitor by
# mouse. The same versions winit already uses: no new crates.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", default-features = false, features = ["client", "staging"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Slint 1.18.1 with the fix for slint-ui/slint#14435 (PR #14543): with the software
# renderer, a Text that changes rarely (the clock) stopped repainting after ~1024 updates
# to other text. Drop this and vendor/ once a Slint release includes the fix.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
