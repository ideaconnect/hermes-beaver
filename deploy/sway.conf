# The kiosk compositor: sway showing the dashboard and nothing else. No bar, no menus,
# no key bindings, no X11. install.sh puts this in ~/.config/hermes-beaver/sway.conf and
# hermes-beaver-kiosk.service runs `sway --config` on it.

# Wayland clients only: without Xwayland no X11 app can open a window here.
xwayland disable

# Windows draw edge to edge, the dashboard full screen. Its own fullscreen request
# loses a race on Wayland: Slint follows sway's first configure, sent before the
# window maps and not fullscreen yet, and withdraws the request.
for_window [app_id="^hermes-beaver$"] fullscreen enable
default_border none
default_floating_border none
focus_follows_mouse no
# The dashboard hides the pointer; this covers the moment before it starts.
seat * hide_cursor 1000
# No wallpaper (swaybg): nothing shows behind a full-screen dashboard.
swaybg_command -

# Host-specific settings, such as the output mode (secrets/sway.conf in the repo).
include ~/.config/hermes-beaver/sway.d/*.conf

# Hand the session to the systemd user manager, then (re)start the dashboard there,
# so it restarts on its own and logs to the journal. DISPLAY goes: there's no X server.
# Chained with && because sway splits commands at ';', even after exec.
exec systemctl --user unset-environment DISPLAY XAUTHORITY && systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_SESSION_ID && systemctl --user restart hermes-beaver.service
