# Copy to secrets/sway.conf and fill in. `make deploy` installs it as
# ~/.config/hermes-beaver/sway.d/host.conf, which the kiosk's sway includes.
# Outputs are named as the kernel names them (/sys/class/drm/card*-<name>),
# e.g. HDMI-A-1, which X called HDMI-A-0. See `man sway-output`.

# Without a mode sway uses the monitor's preferred one (4K on a 4K screen).
output HDMI-A-1 mode 1920x1080@60Hz
